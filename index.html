    <div class="topbar-controls">
      <div class="seg" id="currency-seg" role="group">
        <button data-cur="RUB">₽</button>
        <button data-cur="USD">$</button>
        <button data-cur="JPY">¥</button>
      </div>
      <div class="seg" id="lang-seg" role="group">
        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
        <button data-lang="ja">日本語</button>

      <label class="hide-nko"><input type="checkbox" id="hide-nko"><span id="hide-nko-label"></span></label>
      <span class="counter" id="counter"></span>
    </div>

    <div class="table-wrap">
      <table id="table">
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <footer class="footer">
    <span id="disclaimer"></span>
    <a href="./sources.html" target="_blank" id="sources-link"></a>
  </footer>

  <div class="tooltip" id="tooltip" hidden></div>
